name: Dependency audit

# Advisories change without the code changing, so this runs on a schedule as
# well as whenever the dependency set moves. Keeping it out of the per-push CI
# means a fresh advisory is reported without blocking unrelated work.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the cargo-deny binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked

      - run: cargo deny check
