name: CI

on:
  push:
  pull_request:

# A push that supersedes an earlier one cancels it rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The hardware tests are #[ignore]d and stay out of this; what runs here is
  # everything that needs no board.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the registry and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo build --release --locked
      - run: cargo test --locked

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the registry and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked

  # Checks that the rust-version in Cargo.toml is the truth rather than a wish.
  minimum-supported-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - run: cargo +${{ steps.msrv.outputs.version }} check --all-targets --locked
